name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild, so that new papers on DBLP appear without a push.
  # (GitHub pauses scheduled workflows after 60 days without repository activity.)
  schedule:
    - cron: '23 4 * * 1' # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Diagnostic only: shows in the log which DBLP sources answer from the
      # runner. The build itself falls back to data/dblp.snapshot.json.
      - name: Check DBLP sources
        run: node scripts/update-papers.mjs --check
        continue-on-error: true

      - uses: withastro/action@v6
        with:
          node-version: '24'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
